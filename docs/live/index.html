<!DOCTYPE html>

<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070a'/%3E%3Cpath d='M32 12 48 50 32 42 16 50Z' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #05070a; --card: rgba(16, 21, 29, 0.86); --line: rgba(255, 255, 255, 0.09);
    --text: #eef2f6; --muted: #8a96a6; --accent: #22d3ee; --accent2: #3b82f6; --ok: #34d399; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #map { position: fixed; inset: 0; }
  .card {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px 14px;
    -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  }
  .who { font-size: 13px; color: var(--muted); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 0 rgba(52, 211, 153, .6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .55); } 70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }
  h1 { font-size: 21px; line-height: 1.25; margin: 4px 0 10px; font-weight: 700; }
  .eta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .eta b { font-size: 34px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .eta span { color: var(--text); font-size: 16px; }
  .stats { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chip { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .chip em { font-style: normal; color: var(--muted); margin-right: 4px; }
  .note { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .note.warn { color: var(--warn); }
  .btns { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; }
  .btns button {
    width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .btns button.on { color: var(--accent); border-color: rgba(34, 211, 238, .5); }
  .btns svg { width: 22px; height: 22px; }
  .brand { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top)); background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px 12px; font-size: 13px; color: var(--muted); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .brand b { color: var(--text); } .brand b span { color: var(--accent); }
  .car { width: 44px; height: 44px; display: grid; place-items: center; }
  .car .ring { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: rgba(34, 211, 238, .18); border: 2px solid rgba(34, 211, 238, .55); }
  .car.guess .ring { border-style: dashed; }
  .car.stale .ring { background: rgba(138, 150, 166, .18); border-color: rgba(138, 150, 166, .6); }
  .car svg { position: relative; width: 26px; height: 26px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5)); transition: transform .6s ease; }
  .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--accent2); border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .4); }
  .stop { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--accent2); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; pointer-events: none; }
  .center div { max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; pointer-events: auto; }
  .hidden { display: none !important; }
  .maplibregl-ctrl-attrib { font-size: 11px; }
  /* przyciski w karcie: „Jedź za autem” / „Prowadź do celu” */
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .act { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 12px;
    border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--text);
    font: 600 15px/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; white-space: nowrap; }
  .act.primary { background: linear-gradient(90deg, var(--accent), #67e8f9); color: #04141a; border: 0; }
  .act.stop { background: rgba(248, 113, 113, 0.16); border-color: rgba(248, 113, 113, 0.45); color: #fecaca; }
  .act.on { color: var(--accent); border-color: rgba(34, 211, 238, .5); }
  .act svg { width: 20px; height: 20px; flex: none; }
  .act:active { transform: scale(.97); }
  /* nawigacja: karta manewru na górze */
  .turn { position: fixed; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); max-width: 520px; margin: 0 auto;
    display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 10px 16px 10px 10px; -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); }
  .turn .ic { width: 62px; height: 62px; border-radius: 18px; background: linear-gradient(135deg, var(--accent), #0891b2); display: grid; place-items: center; flex: none; color: #04141a; }
  .turn .ic svg { width: 38px; height: 38px; transition: transform .35s ease; }
  .turn b { font-size: 28px; line-height: 1.1; display: block; font-variant-numeric: tabular-nums; }
  .turn span { font-size: 15px; display: block; margin-top: 2px; color: #cbd5e1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  body.nav .brand { display: none; }
  body.nav .btns { top: calc(100px + env(safe-area-inset-top)); }
  .me { width: 30px; height: 30px; display: grid; place-items: center; }
  .me svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .5)); }
  .me.nohdg svg { display: none; }
  .me .d { display: none; width: 16px; height: 16px; border-radius: 50%; background: #3b82f6; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(59, 130, 246, .25); }
  .me.nohdg .d { display: block; }
  @media (min-width: 700px) { .card { left: 20px; right: auto; width: 420px; bottom: 20px; margin: 0; } .turn { left: 20px; right: auto; width: 420px; margin: 0; } }
</style>

<body>

<div id="card" class="card hidden">
  <div class="who"><i id="dot" class="dot"></i><span id="who">Auto</span><span id="ago"></span></div>

  <div class="acts" id="acts">

    </button>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
"use strict";
// Klucz jest tylko w linku po „#” – przeglądarka nie wysyła go nigdzie. Przekaźnik (ntfy.sh) widzi sam szyfrogram.
const RELAY = "https://ntfy.sh/";
const $ = (id) => document.getElementById(id);

function b64urlToBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function b64ToBytes(s) { return b64urlToBytes(s.trim()); }

async function topicOf(keyBytes) {
  const ch = new TextEncoder().encode("share");
  const all = new Uint8Array(keyBytes.length + ch.length); all.set(keyBytes); all.set(ch, keyBytes.length);
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", all));
  return "caros_" + Array.from(h, (b) => b.toString(16).padStart(2, "0")).join("").slice(0, 28);
}

async function gunzip(bytes) {
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** "2:" + base64(iv 12 B | AES-GCM(gzip(json))) – tak samo jak w CAR OS (core/RelayCrypto). */
async function decrypt(key, msg) {
  try {
    const v2 = msg.startsWith("2:");
    const all = b64ToBytes(v2 ? msg.slice(2) : msg);
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12) }, key, all.slice(12)));
    const txt = new TextDecoder().decode(v2 ? await gunzip(plain) : plain);
    return JSON.parse(txt);
  } catch (e) { return null; }
}

/** Polyline Google (1e-5; Valhalla – 1e-6) → [[lon, lat], …]. */
function decodePolyline(s, f = 1e5) {
  const out = []; let i = 0, lat = 0, lon = 0;
  const next = () => { let shift = 0, res = 0, b; do { b = s.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20); return (res & 1) ? ~(res >> 1) : (res >> 1); };
  while (i < s.length) { lat += next(); lon += next(); out.push([lon / f, lat / f]); }
  return out;
}

// ---------- geometria ----------
const R = 6371000, rad = Math.PI / 180;
function dist(a, b) {
  const dLat = (b[1] - a[1]) * rad, dLon = (b[0] - a[0]) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function cumulative(pts) { const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + dist(pts[i - 1], pts[i])); return c; }
/** Rzut punktu na trasę: { along, off, i }. */
function project(pts, cum, p) {
  let best = { along: 0, off: Infinity, i: 0 };
  const kx = Math.cos(p[1] * rad) * 111320, ky = 110540;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = (pts[i][0] - p[0]) * kx, ay = (pts[i][1] - p[1]) * ky;
    const bx = (pts[i + 1][0] - p[0]) * kx, by = (pts[i + 1][1] - p[1]) * ky;
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 > 0 ? -(ax * dx + ay * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const x = ax + t * dx, y = ay + t * dy, off = Math.hypot(x, y);
    if (off < best.off) best = { along: cum[i] + t * (cum[i + 1] - cum[i]), off, i };
  }
  return best;
}
function pointAt(pts, cum, along) {
  if (along <= 0) return { p: pts[0], i: 0 };
  for (let i = 1; i < pts.length; i++) {
    if (cum[i] >= along) {
      const t = (along - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);
      return { p: [pts[i - 1][0] + t * (pts[i][0] - pts[i - 1][0]), pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1])], i: i - 1 };
    }
  }
  return { p: pts[pts.length - 1], i: pts.length - 2 };
}
function bearing(a, b) {
  const y = Math.sin((b[0] - a[0]) * rad) * Math.cos(b[1] * rad);
  const x = Math.cos(a[1] * rad) * Math.sin(b[1] * rad) - Math.sin(a[1] * rad) * Math.cos(b[1] * rad) * Math.cos((b[0] - a[0]) * rad);
  return (Math.atan2(y, x) / rad + 360) % 360;
}

// ---------- teksty ----------
const hhmm = (t) => new Date(t).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 1) return "za chwilę";
  if (m < 60) return `za ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return `za ${h} h` + (r ? ` ${r} min` : "");
}
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 50) return "przed chwilą";
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min temu`;
  return `${Math.floor(m / 60)} h ${m % 60} min temu`;
}
const km = (m) => m >= 10000 ? `${Math.round(m / 1000)} km` : m >= 1000 ? `${(m / 1000).toFixed(1).replace(".", ",")} km` : `${Math.round(m / 10) * 10} m`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- stan ----------
// na start cała trasa z autem; „Śledź auto” – mapa jedzie za autem
const st = { pos: null, route: null, end: null, lastId: null, seen: new Set(), follow: false, fitted: false };

function show(msg) { $("msgText").innerHTML = msg; $("msg").classList.remove("hidden"); }
function hideMsg() { $("msg").classList.add("hidden"); }

async function main() {
  const raw = location.hash.slice(1).split("&")[0];
  let keyBytes;
  try { keyBytes = b64urlToBytes(raw); } catch (e) { keyBytes = null; }
  if (!keyBytes || keyBytes.length !== 32) {
    show("<b>Nieprawidłowy link</b><br><span style='color:var(--muted)'>Poproś o nowy link do jazdy na żywo z CAR OS albo CAR OS Connect.</span>");
    return;
  }
  if (!window.crypto?.subtle || typeof DecompressionStream === "undefined") {
    show("<b>Ta przeglądarka jest za stara</b><br><span style='color:var(--muted)'>Otwórz link w aktualnym Chrome, Safari albo Firefoxie.</span>");
    return;
  }
  const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
  const topic = await topicOf(keyBytes);
  // bez mapy (np. zablokowany serwer map) karta z przyjazdem i tak działa
  try { if (window.maplibregl) initMap(); } catch (e) { map = null; }
  show("Czekam na pozycję auta…");
  const poll = async () => {
    try {
      const url = RELAY + topic + "/json?poll=1&since=" + (st.lastId || "all");
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const lines = (await r.text()).split("\n").filter(Boolean);
      for (const line of lines) {
        let m; try { m = JSON.parse(line); } catch (e) { continue; }
        if (m.event !== "message" || st.seen.has(m.id)) continue;
        st.seen.add(m.id); st.lastId = m.id;
        const o = await decrypt(key, m.message || "");
        if (o) handle(o);
      }
      $("note").classList.remove("warn");
    } catch (e) {
      if (!st.pos) show("Nie mogę połączyć się z serwerem – sprawdzam ponownie…");
    }
    render();
  };
  await poll();
  setInterval(() => { if (!document.hidden) poll(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  setInterval(render, 1000);
}

function handle(o) {
  if (o.type === "sh") {
    if (!st.pos || o.t >= st.pos.t) st.pos = o;
    // pozycja bez trasy, nowsza niż trasa – kierowca zakończył nawigację (starszy CAR OS nie wysyła „koniec trasy”)
    if (st.route && !o.rid && !o.dest && o.t > st.route.t + 5000) { st.routeClearedAt = o.t; clearRoute(false); }
  }
  else if (o.type === "shr") {
    const after = !st.routeClearedAt || o.t > st.routeClearedAt;
    if (o.clear || !o.pl) {
      // koniec / anulowanie trasy w aucie – linia i cel znikają
      if (after) { st.routeClearedAt = o.t; clearRoute(false); }
    } else if (after && (!st.route || o.t >= st.route.t)) {
      const pts = decodePolyline(o.pl || "");
      // pierwsza trasa – pokaż całą; przeliczona w czasie jazdy – bez skakania mapą
      if (pts.length >= 2) { if (!st.route) st.fitted = false; st.route = { ...o, pts, cum: cumulative(pts) }; drawRoute(); }
    }
  }
  else if (o.type === "she") {
    if (!st.end || o.t >= st.end.t) st.end = o;
    // koniec udostępniania: bez linii trasy; przy dojechaniu zostaje tylko pinezka celu
    clearRoute(o.why === "arrived");
  }
}

/** Cel z najnowszych danych (po zakończeniu trasy – brak). */
function curDest() {
  const p = st.pos;
  const fromPos = p && p.dest && !(st.routeClearedAt && p.t < st.routeClearedAt) ? p.dest : null;
  return fromPos || st.route?.dest || null;
}

function clearRoute(keepDest) {
  st.route = null; doneKey = "";
  if (map && mapReady) { map.getSource("route")?.setData(emptyLine()); map.getSource("done")?.setData(emptyLine()); }
  stopMarkers.forEach((m) => m.remove()); stopMarkers = [];
  if (destMarker && !keepDest) destMarker.remove();
}

// ---------- mapa ----------
let map, carMarker, carEl, destMarker, stopMarkers = [], mapReady = false, doneKey = "";
function initMap() {
  const dark = !matchMedia("(prefers-color-scheme: light)").matches;
  map = new maplibregl.Map({
    container: "map", style: "https://tiles.openfreemap.org/styles/" + (dark ? "dark" : "positron"),
    center: [17.0, 52.0], zoom: 5, attributionControl: { compact: true },
  });
  map.on("dragstart", () => { setFollow(false); if (nav) { nav.cam = false; $("follow").classList.remove("on"); } });
  map.on("load", () => {
    map.addSource("route", { type: "geojson", data: emptyLine() });
    map.addSource("done", { type: "geojson", data: emptyLine() });
    map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#0b3a66", "line-width": ["interpolate", ["linear"], ["zoom"], 5, 6, 14, 12] } });
    map.addLayer({ id: "route", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#3b9cff", "line-width": ["interpolate", ["linear"], ["zoom"], 5, 3.5, 14, 8] } });

/** Gdzie jest auto teraz: ostatnia pozycja, a w ruchu – przesunięta po trasie o prędkość × czas (najwyżej 5 min). */

async function reroute(why) {

async function routeValhalla(from, fromBrg, to, toBrg) {
  const loc = (p, b) => {
    const o = { lat: +p[1].toFixed(6), lon: +p[0].toFixed(6) };
    if (b != null) { o.heading = Math.round((b + 360) % 360); o.heading_tolerance = 60; }
    return o;
  };

  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
  const res = await fetch(VALHALLA + encodeURIComponent(JSON.stringify(req)), { cache: "no-store", signal: ctl.signal });
  clearTimeout(tm);
  if (!res.ok) throw new Error("valhalla " + res.status);
  const js = await res.json();
  const leg = js.trip.legs[0];
  const pts = decodePolyline(leg.shape, 1e6);
  const cum = cumulative(pts);
  const man = leg.maneuvers.map((m) => ({
    type: m.type, at: cum[Math.min(m.begin_shape_index, pts.length - 1)],
    text: (m.instruction || "").replace(/\.$/, ""),
    alert: m.verbal_transition_alert_instruction || m.verbal_pre_transition_instruction || m.instruction || "",
    pre: m.verbal_pre_transition_instruction || m.instruction || "",

  return { pts, cum, man, len: js.trip.summary.length * 1000, time: js.trip.summary.time };
}

async function routeOsrm(from, to) {
  const url = OSRM + `${from[0].toFixed(6)},${from[1].toFixed(6)};${to[0].toFixed(6)},${to[1].toFixed(6)}?overview=full&geometries=polyline&steps=true`;
  const res = await fetch(url, { cache: "no-store" });

  const cum = cumulative(pts);
  const man = [];
  rt.legs[0].steps.forEach((s) => {
    const loc = s.maneuver.location;
    const pr = project(pts, cum, loc);
    const t = osrmText(s);
    man.push({ type: osrmType(s), at: pr.along, text: t, alert: t, pre: t });

}

    "sharp left": "Skręć ostro w lewo", left: "Skręć w lewo", "slight left": "Skręć lekko w lewo", straight: "Jedź prosto" }[mod] || "Jedź dalej";

    nav.mode = "car"; nav.r = null; nav.routedAt = 0; nav.arrived = false;
    if (map && mapReady) map.getSource("nav")?.setData(emptyLine());
    say("Kierowca zakończył trasę. Prowadzę za autem.");
  }
  const me = nav.me, r = nav.r;
  const tg = navTarget(now);
  if (!me) return;
  if (!tg) { $("navNote").textContent = "Brak pozycji auta – czekam"; return; }
  const toTarget = dist(me.p, tg.p);
  const carMoving = !!(st.pos && st.pos.m) && !(st.end || (st.pos.until && now > st.pos.until));

      const moved = nav.routedTo ? dist(nav.routedTo, tg.p) : 1e9;
      if (nav.off >= 2) why = "off";
      else if (nav.mode === "car" && moved > 150 && now - nav.routedAt > 15000) why = "car";
      else if (nav.mode === "car" && moved > 30 && now - nav.routedAt > 60000) why = "car";
      else if (nav.mode === "dest" && moved > 200) why = "dest";
      else if (now - nav.routedAt > 5 * 60000) why = "old";

  if (map && mapReady) {
    const k = Math.round(pr.along / 15) + ":" + r.id;
    if (k !== nav.drawn) { nav.drawn = k; map.getSource("nav")?.setData(line([pointAt(r.pts, r.cum, pr.along).p].concat(r.pts.slice(pr.i + 1)))); }
  }
  // następny manewr
  const ni = r.man.findIndex((m, i) => i > 0 && m.at > pr.along + 3);
  const nm = ni >= 0 ? r.man[ni] : null;
  if (near) {
    $("turnDist").textContent = nav.mode === "car" ? distTxt(toTarget) : "Na miejscu";
    $("turnText").textContent = nav.mode === "car" ? (carMoving ? "Auto tuż przed Tobą" : "Auto jest tutaj") : "Jesteś u celu";
    setTurnIcon(null);
  } else if (nm) {
    const d = nm.at - pr.along;
    $("turnDist").textContent = distTxt(d);
    $("turnText").textContent = (nm.type >= 4 && nm.type <= 6) ? (nav.mode === "car" ? (carMoving ? "Tu będzie auto – jedzie dalej, trasa się przeliczy" : "Auto stoi tutaj") : nm.text) : nm.text;
    setTurnIcon(nm.type);
    // głos: zapowiedź i polecenie tuż przed manewrem
    const v = Math.max(me.spd || 0, 8);
    const key = r.id + ":" + ni;
    if (d < Math.max(45, v * 4)) { if (!nav.spoken.has(key + "p")) { nav.spoken.add(key + "p"); nav.spoken.add(key + "a"); say(nm.pre); } }
    else if (d < Math.max(300, v * 18) && d > 120) { if (!nav.spoken.has(key + "a")) { nav.spoken.add(key + "a"); say(`Za ${spokenKm(d)}, ${nm.alert.charAt(0).toLowerCase()}${nm.alert.slice(1)}`); } }
  } else {
    $("turnDist").textContent = distTxt(left); $("turnText").textContent = "Jedź dalej"; setTurnIcon(null);
  }
  showNavCard(left, r.time * (left / Math.max(1, total)), tg, carMoving);
}

function setTurnIcon(type) {
  const deg = type != null && TURN_DEG[type] != null ? TURN_DEG[type] : 0;
  $("turnIc").style.transform = `rotate(${deg}deg)`;
}

function showNavCard(left, secs, tg, carMoving) {
  const now = Date.now();
  const dest = curDest();
  $("navWho").textContent = nav.mode === "car" ? `Jedziesz za: ${st.pos?.who || "auto"}` : `Do celu: ${dest ? dest.n : "cel"}`;
  $("navTime").textContent = secs != null ? (secs < 60 ? "<1 min" : `${Math.round(secs / 60)} min`) : "—";
  $("navDist").textContent = distTxt(left) + (secs != null && nav.mode === "dest" ? ` · przyjazd ${hhmm(now + secs * 1000)}` : "");
  const stats = [];
  if (st.pos) {
    if (nav.mode === "car") {
      stats.push(`<span class="chip"><em>auto</em>${carMoving ? (st.pos.spd || 0) + " km/h" : "stoi"}</span>`);
      if (dest) stats.push(`<span class="chip"><em>jedzie do</em>${esc(dest.n)}</span>`);
    } else if (st.pos.eta && carMoving) stats.push(`<span class="chip"><em>auto będzie o</em>${hhmm(st.pos.eta)}</span>`);
    stats.push(`<span class="chip"><em>pozycja auta</em>${ago(now - st.pos.t)}</span>`);
  }
  $("navStats").innerHTML = stats.join("");
  if (nav.err) $("navNote").textContent = nav.err;
  else if (nav.mode === "car") $("navNote").textContent = carMoving
    ? "Trasa przelicza się sama, gdy auto odjedzie dalej. Auto wysyła pozycję co ok. 2–3 min – między nimi przyjmuję, że jedzie swoją trasą."
    : "Auto stoi – prowadzę do jego miejsca.";
  else $("navNote").textContent = "Trasa przelicza się, gdy zjedziesz z drogi.";
}

/** Kamera nawigacji: za Tobą, przechylona, w kierunku jazdy; trochę dalej przy dużej prędkości. */
function navCamera(force) {
  if (!nav || !map || !nav.me || !nav.cam) return;
  if (!force && map.isMoving()) return;
  const v = (nav.me.spd || 0) * 3.6;
  const zoom = v > 90 ? 14.6 : v > 50 ? 15.4 : 16.4;
  const bottom = ($("nav").offsetHeight || 180) + 30;
  map.easeTo({
    center: nav.me.p, zoom, pitch: 50, bearing: nav.me.hdg ?? map.getBearing(),
    padding: { top: 150, bottom, left: 20, right: 20 }, duration: force ? 800 : 950,
  });
}

setInterval(() => { if (nav) navTick(); }, 1000);

main();
</script>
</body>
