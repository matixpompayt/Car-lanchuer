name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
            { grep -E "^e: " build.log; awk '/What went wrong/{f=1} /\* Try:/{f=0} f' build.log; grep -iE "^ERROR:|AAPT: error" build.log; } | grep -v "^\s*$" | head -45 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CarOS-1.0.${BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CarOS-apk
          path: out/*.apk

      # Każdy build na main = nowe wydanie. Aplikacja sprawdza /releases/latest i aktualizuje się online.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG=$(git log -1 --pretty=%B | head -c 1500)
          gh release create "v1.0.${BUILD_NUMBER}" out/*.apk \
            --title "CAR OS 1.0.${BUILD_NUMBER}" \
            --notes "$MSG" \
            --latest
