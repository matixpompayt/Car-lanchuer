name: Build APK

# Gałąź beta: wersja testowa 2.0 (wydania „prerelease” – stabilne /releases/latest się nie zmienia)
on:
  push:
    branches: [beta]
    # strona (docs/) i README nie budują nowej wersji aplikacji
    paths-ignore: ["docs/**", "**.md", "tools/**", ".github/workflows/fuel-prices.yml", ".github/workflows/speed-data.yml", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      BETA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Lista zmian: sekcja „## next” dostaje numer tej wersji i datę (trafia do CAR OS i do opisu wydania)
      - name: Changelog
        run: |
          BB=$(grep "^betaBase=" gradle.properties | cut -d= -f2)
          V="2.0-beta.$((BUILD_NUMBER - BB))"
          CL=app/src/main/assets/changelog.txt
          if grep -q "^## next$" "$CL"; then
            sed -i "s/^## next$/## $V · $(date +%F)/" "$CL"
            echo "CL_CHANGED=1" >> "$GITHUB_ENV"
          fi
          awk -v v="## $V " 'index($0, v)==1 {f=1; next} /^## /{f=0} f' "$CL" | sed '/^#/d' > notes.md
          if [ ! -s notes.md ]; then
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV" ]; then git log --no-merges --pretty='%B' "$PREV..HEAD"; else git log -1 --pretty='%B'; fi \
              | grep -vE '^(Co-Authored-By|Claude-Session|https://claude\.ai)' | cat -s | head -c 3000 > notes.md || true
          fi
          cat notes.md

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          # testy wspólnego modułu (protokół, szyfrowanie, geometria tras) – błąd = brak wydania
          if ! ./gradlew :core:testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log; then
            grep -E "Test.*FAILED|AssertionError|expected:" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            { grep -E "^e: " build.log; awk '/What went wrong/{f=1} /\* Try:/{f=0} f' build.log; grep -iE "^ERROR:|AAPT: error" build.log; } | grep -v "^\s*$" | head -45 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p out
          BB=$(grep "^betaBase=" gradle.properties | cut -d= -f2)
          VER="2.0-beta.$((BUILD_NUMBER - BB))"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODE=$((100000 + BUILD_NUMBER))" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "out/CarOS-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CarOS-apk
          path: out/*.apk

      # Każdy build na beta = wydanie testowe (prerelease). Tag kończy się versionCode (100000 + numer builda).
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VER}-b${CODE}" out/*.apk \
            --title "CAR OS ${VER}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false

      # Numer wersji wpisany w liście zmian zapisujemy z powrotem w repozytorium
      - name: Save changelog
        if: env.CL_CHANGED == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/changelog.txt
          git commit -m "Lista zmian: CAR OS ${VER} [skip ci]" || exit 0
          git push origin HEAD:beta || echo "::warning::Nie udało się zapisać listy zmian (nowszy commit na beta)"
